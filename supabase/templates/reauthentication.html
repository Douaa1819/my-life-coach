<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Confirm it's you</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f8f7fc">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f8f7fc">
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 520px;
              background-color: #ffffff;
              border: 1px solid #eae7f3;
              border-radius: 20px;
            ">
            <tr>
              <td
                style="
                  padding: 40px 32px 32px 32px;
                  font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                ">
                <p
                  style="
                    margin: 0 0 8px 0;
                    font-size: 12px;
                    line-height: 16px;
                    font-weight: 600;
                    letter-spacing: 0.8px;
                    text-transform: uppercase;
                    color: #5b4bc4;
                  ">
                  AI Coach
                </p>
                <h1
                  style="
                    margin: 0 0 12px 0;
                    font-size: 26px;
                    line-height: 32px;
                    font-weight: 600;
                    color: #242238;
                  ">
                  Confirm it's you
                </h1>
                <p style="margin: 0 0 28px 0; font-size: 16px; line-height: 24px; color: #6e6a85">
                  Enter this code in AI Coach to confirm a sensitive change, such as a new password.
                </p>
                <p
                  style="
                    margin: 0 0 28px 0;
                    font-size: 32px;
                    line-height: 40px;
                    font-weight: 600;
                    letter-spacing: 6px;
                    color: #5b4bc4;
                  ">
                  {{ .Token }}
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 20px; color: #777489">
                  This code expires in 1 hour. If you didn't ask for it, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
          <p
            style="
              margin: 20px 0 0 0;
              font-family:
                -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
              font-size: 12px;
              line-height: 16px;
              color: #777489;
            ">
            AI Personal Coach &middot; Small steps, every day.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
